<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMC タイム集計</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --ink:#1d2330; --muted:#677084; --line:#d9dde5;
  --accent:#2f6fde; --accent-ink:#fff; --accent-soft:#e6eefc;
  --err:#c62f2f; --err-bg:#fde8e8; --warn:#9a6700; --warn-bg:#fff4d6;
  --dup-bg:#f3e8ff; --dup:#7a3fb8; --info-bg:#e9f3fb; --info:#2a6496; --ok:#237a3c;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- 画面の骨組み ---------- */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#1d2330;color:#fff}
.topbar h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.02em}
.topbar .ev{color:#b8c1d4;font-size:13px}
.topbar .sp{flex:1}
.topbar button{background:#323b4d;border:1px solid #485267;color:#fff;border-radius:6px;padding:5px 10px;font-size:13px}
.topbar button:hover{background:#3d475c}
.topbar button.danger{border-color:#7d3a3a}
.topbar .pub{color:#b8c1d4;font-size:12px}
.app.view .edit-only{display:none}
.steps{display:flex;gap:4px;overflow-x:auto;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.steps button{flex:none;border:1px solid transparent;background:none;border-radius:6px;padding:6px 10px;color:var(--muted);white-space:nowrap}
.steps button:hover{background:var(--bg)}
.steps button.on{background:var(--accent-soft);color:var(--accent);border-color:#c6d6f7;font-weight:700}
.steps .badge{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;border-radius:9px;background:var(--bg);font-size:11px;text-align:center;color:var(--muted)}
.steps button.on .badge{background:#fff}
main{max-width:1120px;margin:0 auto;padding:16px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.panel h2{font-size:15px;margin:0 0 10px}
.panel h3{font-size:14px;margin:12px 0 6px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.field input{font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;color:var(--ink);min-width:160px}

.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.45;cursor:default}

.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 12px}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab .cnt{margin-left:6px;font-size:12px;opacity:.7}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--bg);border-radius:12px;padding:2px 10px;font-size:12px}
.chip.err{background:var(--err-bg);color:var(--err)}

/* ---------- 編集できる表 ---------- */
.gridwrap{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:8px}
table.grid{border-collapse:collapse;width:100%}
.grid th{position:sticky;top:0;z-index:1;background:#eef0f4;text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:5px 6px;border-bottom:1px solid var(--line)}
.grid td{border-bottom:1px solid #edf0f4;padding:0}
.grid td.num{width:40px;text-align:right;padding-right:8px;color:var(--muted);font-size:12px}
.grid input{width:100%;border:0;background:transparent;padding:6px 6px;outline:none}
.grid input:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--accent)}
.grid input.mono{font-family:var(--mono)}
.grid td.ops{width:1%;white-space:nowrap;padding:0 4px}
.grid .op{border:0;background:none;color:var(--muted);padding:2px 5px;border-radius:4px}
.grid .op:hover{background:var(--bg);color:var(--ink)}
.grid .op.del:hover{color:var(--err)}
.grid tr.err td{background:var(--err-bg)}
.grid tr.warn td{background:var(--warn-bg)}
.grid tr.dup td{background:var(--dup-bg)}
.grid tr.info td{background:var(--info-bg)}
.grid tr[title] td.num::after{content:" ●";font-size:9px}
.grid tr.err td.num{color:var(--err)}
.grid tr.warn td.num{color:var(--warn)}
.grid tr.dup td.num{color:var(--dup)}
.grid tr.info td.num{color:var(--info)}

/* ---------- 表示用の表 ---------- */
table.list{border-collapse:collapse;width:100%}
.list th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:5px 8px;border-bottom:1px solid var(--line);background:#f7f8fa}
.list td{padding:5px 8px;border-bottom:1px solid #edf0f4}
.list td.t{font-family:var(--mono)}
.list td.r,.list th.r{text-align:right}
.list tr.sep td{background:#f7f8fa;font-weight:700;color:var(--muted);font-size:12px}
.list td.best{font-weight:700}
.empty{color:var(--muted);padding:18px;text-align:center}
.list tr.warn td{background:var(--warn-bg)}
.list tr.err td{background:var(--err-bg)}
.list td.m{color:var(--muted)}
textarea.roster{width:100%;height:240px;font-family:var(--mono);font-size:12px;
  border:1px solid var(--line);border-radius:6px;padding:8px;background:#fff;resize:vertical}

/* ---------- 注意の一覧 ---------- */
.issues{margin:0;padding:0;list-style:none;font-size:13px}
.issues li{padding:4px 8px;border-radius:5px;margin-bottom:3px}
.issues li.err{background:var(--err-bg);color:var(--err)}
.issues li.warn{background:var(--warn-bg);color:var(--warn)}
.issues li.dup{background:var(--dup-bg);color:var(--dup)}
.issues li.info{background:var(--info-bg);color:var(--info)}
.ok{color:var(--ok);font-size:13px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend .err::before{background:var(--err-bg);border:1px solid var(--err)}
.legend .warn::before{background:var(--warn-bg);border:1px solid var(--warn)}
.legend .dup::before{background:var(--dup-bg);border:1px solid var(--dup)}
.legend .info::before{background:var(--info-bg);border:1px solid var(--info)}

.drop{border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

dialog{border:0;border-radius:12px;padding:0;width:min(640px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,25,35,.45)}
.dlg-h{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.dlg-b{padding:14px 18px}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
dialog textarea{width:100%;height:220px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:8px}
dialog label{display:flex;gap:6px;align-items:center;margin:4px 0}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:min(560px,calc(100vw - 32px));
  background:#1d2330;color:#fff;border-radius:8px;padding:10px 16px;font-size:13px;white-space:pre-line;
  box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.err{background:var(--err)}

/* ---------- 印刷 ---------- */
#print-root{display:none}
@page{size:A4 portrait;margin:19mm 6mm}
@media print{
  body{background:#fff}
  .app,#toast,dialog{display:none!important}
  #print-root{display:block;font-family:"MS PGothic","ＭＳ Ｐゴシック","Hiragino Kaku Gothic ProN",sans-serif;color:#000}
  .page{break-after:page}
  .page:last-child{break-after:auto}
}
.p-table{border-collapse:collapse;width:100%;font-size:11pt}
.p-table th,.p-table td{border:0.5pt solid #000;padding:0 2mm;height:7mm}
.p-table thead .p-head td{border:0;height:auto;padding:0 0 3mm}
.p-table th{font-weight:normal;height:6mm;background:#eee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.p-table td.c{text-align:center}
.p-table td.t{font-family:inherit}
.p-hd{display:flex;justify-content:space-between;align-items:flex-end}
.p-hd .l{font-size:16pt;font-weight:bold}
.p-hd .l small{display:block;font-size:10pt;font-weight:normal}
.p-hd .r{text-align:right;font-size:9pt}
.p-sl-title{font-size:15pt;font-weight:bold;height:10mm}
/* line-height は body の 1.5 を打ち消すために必ず指定する。継承したままだと
   8.5pt × 1.5 = 4.5mm の行箱が height より高くなり、55行が1ページに収まらない。 */
.p-sl{border-collapse:collapse;width:100%;table-layout:fixed;font-size:8.5pt;line-height:1.1}
.p-sl td{border:0.5pt solid #000;height:4.2mm;padding:0 1mm;white-space:nowrap;overflow:hidden}
.p-sl td.b{text-align:center}
.p-sl td.gap{border:0;width:1.5mm}
.p-sl td.sep{background:#ddd;font-weight:bold;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>MMC タイム集計</h1>
    <span class="ev" id="ev-label"></span>
    <span class="sp"></span>
    <span class="pub" id="pub-label"></span>
    <button id="btn-publish" class="edit-only" title="今のスタートリストとリザルトを、閲覧用の画面に公開します">公開</button>
    <button id="btn-viewurl" class="edit-only" title="閲覧用 URL をクリップボードにコピーします">閲覧用 URL</button>
    <button id="btn-save" class="edit-only" title="大会データ一式を JSON ファイルに保存します">データを保存</button>
    <button id="btn-load" class="edit-only" title="保存した JSON ファイルを読み込みます">データを読み込み</button>
    <button id="btn-clear" class="danger edit-only" title="エントリー以外を消します">リザルトをクリア</button>
    <button id="btn-reset" class="danger edit-only" title="エントリーも含めてすべて消します">すべて消去</button>
  </header>
  <nav class="steps" id="steps"></nav>
  <main id="view"></main>
</div>
<div id="print-root"></div>
<div id="toast"></div>
<dialog id="dlg"></dialog>
<input type="file" id="file-json" accept=".json,application/json" hidden>
<input type="file" id="file-csv" accept=".csv,text/csv,text/plain" hidden>
<input type="file" id="file-txt" accept=".txt,text/plain" hidden>

<script>
'use strict';

//=====================================================================
// 定数とデータ
//   ビブの百の位がクラス（CLASS_BIB 参照。1=Expert … 6=Kids、9=OldTimer）。
//   連番ではないので、添字との変換は必ず CLASS_BIB を通す。タイムは "mm:ss.fff" の
//   文字列のまま扱い、並べ替えも文字列比較で行う（Excel 版と同じ）。
//=====================================================================
const CLASSES = ['Expert', 'Sports', 'Beginner', 'Girls', 'Junior', 'Kids', 'OldTimer'];
const CLASS_BIB = [1, 2, 3, 4, 5, 6, 9];       // 添字 → ビブの百の位
const RUN_ORDER = [5, 4, 3, 2, 1, 0, 6];       // 出走順：Kids → … → Expert → OldTimer
const STORE_KEY = 'mmc-timing-v1';
const TIME_RE = /^\d{2}:\d{2}\.\d{2,3}$/;      // Kids は小数2桁
const STARTLIST_ROWS = 55;                      // 印刷用：1列の行数
const STARTLIST_COLS = 3;                       // 印刷用：1ページの列数
const STARTLIST_PER_PAGE = STARTLIST_ROWS * STARTLIST_COLS;   // 1ページの行数（クラスの区切りも1行と数える）

// 公開と閲覧（Firestore）。仕組みは下の「公開（Firestore）」の節を見ること。
// ↓↓↓ Firebase コンソールで作ったプロジェクトの値をここに貼る ↓↓↓
const FIREBASE = {
  config: {            // Firebase コンソール →「ウェブアプリ」の設定値。Firestore と認証に要るぶんだけ。
    apiKey: 'AIzaSyABC9fdpqJSrpEyFMpkJO3VhENjX8MHk0c',
    authDomain: 'mmctiming-437a5.firebaseapp.com',
    projectId: 'mmctiming-437a5',
    appId: '1:942464625604:web:d315ed3601a22f79251291',
  },
  eventId: 'mmc',      // 大会ごとに変えると前の大会の分が残る。閲覧用 URL の #view/<ここ>
};
const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/10.14.1/';
const VIEW_STEPS = ['first', 'final'];                       // 閲覧モードで見せる画面（公開するのはリザルトだけ）
const viewHash = /^#view\/([A-Za-z0-9_-]+)$/.exec(location.hash);
const VIEW = !!viewHash;                                     // 閲覧モード（読むだけ。保存も公開もしない）
const EVENT_ID = viewHash ? viewHash[1] : FIREBASE.eventId;

const STEPS = [
  ['import', '1 名簿取込'],
  ['entry',  '2 エントリー'],
  ['start1', '3 スタートリスト1本目'],
  ['res1',   '4 1本目リザルト'],
  ['first',  '5 1本目クラス別'],
  ['start2', '6 スタートリスト2本目'],
  ['res2',   '7 2本目リザルト'],
  ['final',  '8 リザルト'],
  ['web',    '9 Web用'],
];

function emptyState() {
  return { version: 1, event: { name: '', date: '' }, entries: CLASSES.map(() => []), res1: [], res2: [] };
}

// 閲覧モードでは、この端末に保存されている編集中のデータは読まない（公開された分だけを表示する）
let state = (VIEW ? null : loadState()) || emptyState();
const ui = {
  step: VIEW ? 'start1' : 'entry',
  cls: { entry: 0, first: 0, final: 0 },
  fillCls: 5,                                                // 「エントリーから追加」の対象クラス（既定 Kids、-1 は全クラス）
  imp: { text: '', groups: null, map: [], replace: true },   // 名簿取込（保存はしない）
};

//=====================================================================
// 共通の補助関数
//=====================================================================
const $ = (sel, root = document) => root.querySelector(sel);

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : String(c));
  }
  return el;
}

// 全角数字などを半角にして前後の空白を除く（ビブ・タイム用）
const norm = v => String(v ?? '').normalize('NFKC').trim();
const str = v => String(v ?? '').trim();

// ビブからクラスの添字（0～5）。判定できなければ -1（VBA の ClassIndexOf と同じ）
function classOf(bib) {
  bib = norm(bib);
  return /^\d.{2}$/.test(bib) ? CLASS_BIB.indexOf(Number(bib[0])) : -1;
}

// ビブの比較：数字同士は数値順、数字は文字より前、空欄は最後
function cmpBib(a, b) {
  a = norm(a); b = norm(b);
  if (!a || !b) return (!a) - (!b);
  const na = /^\d+$/.test(a), nb = /^\d+$/.test(b);
  if (na && nb) return Number(a) - Number(b);
  if (na !== nb) return na ? -1 : 1;
  return a < b ? -1 : a > b ? 1 : 0;
}

// タイムの比較：文字列比較（大文字小文字は区別しない）。空欄は昇順・降順とも最後
function cmpTime(a, b, desc = false) {
  a = str(a); b = str(b);
  if (!a || !b) return (!a) - (!b);
  const A = a.toUpperCase(), B = b.toUpperCase();
  const r = A < B ? -1 : A > B ? 1 : 0;
  return desc ? -r : r;
}

const sortBy = (arr, cmp) => arr.slice().sort(cmp);   // Array.prototype.sort は安定ソート

function countBy(values) {
  const m = new Map();
  for (const v of values) if (v) m.set(v, (m.get(v) || 0) + 1);
  return m;
}

function formatDate(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  return m ? `${m[1]}/${Number(m[2])}/${Number(m[3])}` : '';
}

//=====================================================================
// 保存（ブラウザ内に自動保存＋JSON ファイル）
//=====================================================================
function sanitizeRows(rows, fields) {
  if (!Array.isArray(rows)) return [];
  return rows.filter(r => r && typeof r === 'object')
    .map(r => Object.fromEntries(fields.map(f => [f, String(r[f] ?? '')])));
}

function sanitizeState(s) {
  if (!s || typeof s !== 'object') return null;
  // 公開データはリザルトだけ（エントリーを含まない）。どれか1つでも配列があれば読む。
  if (!Array.isArray(s.entries) && !Array.isArray(s.res1) && !Array.isArray(s.res2)) return null;
  // OldTimer を足す前（6クラス）の保存データも読めるように、足りないクラスは空で補う
  return {
    version: 1,
    event: { name: String(s.event?.name ?? ''), date: String(s.event?.date ?? '') },
    entries: CLASSES.map((_, k) => sanitizeRows(s.entries?.[k], ['bib', 'name', 'kana'])),
    res1: sanitizeRows(s.res1, ['bib', 'name', 'time']),
    res2: sanitizeRows(s.res2, ['bib', 'name', 'time']),
  };
}

function loadState() {
  try { return sanitizeState(JSON.parse(localStorage.getItem(STORE_KEY))); }
  catch (e) { return null; }
}

let saveFailed = false;
function save() {
  if (VIEW) { updateChrome(); return; }   // 閲覧モードは端末のデータに触らない
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    saveFailed = false;
  } catch (e) {
    if (!saveFailed) toast('ブラウザ内への保存に失敗しました。「データを保存」でファイルに保存してください。', true);
    saveFailed = true;
  }
  updateChrome();
}

//=====================================================================
// 文字コード：CSV は Shift-JIS（CP932）。ブラウザは Shift-JIS で書き出せないので、
// デコーダーから逆引き表を作って変換する
//=====================================================================
let sjisTable = null;
function sjisMap() {
  if (sjisTable) return sjisTable;
  const dec = new TextDecoder('shift_jis');
  const m = new Map([['¥', [0x5C]], ['‾', [0x7E]], ['−', [0x81, 0x7C]]]);
  for (let b = 0xA1; b <= 0xDF; b++) m.set(dec.decode(new Uint8Array([b])), [b]);
  for (let lead = 0x81; lead <= 0xFC; lead++) {
    if (lead >= 0xA0 && lead <= 0xDF) continue;
    // NEC選定IBM拡張（ED, EE）と外字領域（F0～F9）は書き出しに使わない（Windows と同じ選び方）
    if (lead === 0xED || lead === 0xEE || (lead >= 0xF0 && lead <= 0xF9)) continue;
    for (let t = 0x40; t <= 0xFC; t++) {
      if (t === 0x7F) continue;
      const s = dec.decode(new Uint8Array([lead, t]));
      if (s.length === 1 && s !== '�' && !m.has(s)) m.set(s, [lead, t]);
    }
  }
  return (sjisTable = m);
}

// 変換できない文字は "?" にして bad に集める
function encodeSjis(text) {
  const map = sjisMap();
  const out = [], bad = new Set();
  for (const ch of text) {
    const c = ch.codePointAt(0);
    if (c < 0x80) { out.push(c); continue; }
    const b = map.get(ch);
    if (b) out.push(...b);
    else { out.push(0x3F); bad.add(ch); }
  }
  return { bytes: new Uint8Array(out), bad };
}

// UTF-8 として正しければ UTF-8、そうでなければ Shift-JIS として読む
function decodeText(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf).replace(/^﻿/, ''); }
  catch (e) { return new TextDecoder('shift_jis').decode(buf); }
}

// CSV の1行を項目に分解する（"～" で囲まれた項目に対応）
function parseCsvLine(s) {
  const out = [];
  let cur = '', inQ = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (inQ) {
      if (ch === '"') {
        if (s[i + 1] === '"') { cur += '"'; i++; } else inQ = false;
      } else cur += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { out.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  out.push(cur.trim());
  return out;
}

function download(name, data, type) {
  const url = URL.createObjectURL(new Blob([data], { type }));
  const a = h('a', { href: url, download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// Shift-JIS の CSV を保存する。変換できない文字があれば確認する
function downloadSjisCsv(name, lines) {
  const text = lines.map(cells => cells.map(csvCell).join(',')).join('\r\n') + '\r\n';
  const { bytes, bad } = encodeSjis(text);
  if (bad.size && !confirm(`Shift-JIS に変換できない文字があります：${[...bad].join(' ')}\n` +
                           `「?」に置き換えて保存しますか？`)) return false;
  download(name, bytes, 'text/csv');
  return true;
}

function csvCell(v) {
  v = String(v ?? '');
  return /[",\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = h('textarea', { style: 'position:fixed;opacity:0' });
    ta.value = text;
    document.body.append(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }
}

let toastTimer = null;
function toast(msg, isErr = false) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, isErr ? 7000 : 3500);
}

//=====================================================================
// 集計ロジック（VBA マクロの移植）
//=====================================================================

// Entry：1クラス分の入力済みの行（ビブか名前のどちらかがある行）
const entryRows = k => state.entries[k].filter(r => str(r.bib) || str(r.name));

// 1桁・2桁のビブにクラス番号を付ける（例：Sports の 5 → 205）
function fixEntryBib(v, k) {
  const b = norm(v);
  if (/^\d$/.test(b)) return `${CLASS_BIB[k]}0${b}`;
  if (/^\d{2}$/.test(b)) return `${CLASS_BIB[k]}${b}`;
  return b;
}

// SortEntryList：ビブを整形して並べ替え、空行を詰める
function sortEntries(k) {
  const rows = entryRows(k).map(r => ({ ...r, bib: fixEntryBib(r.bib, k) }));
  state.entries[k] = sortBy(rows, (a, b) => cmpBib(a.bib, b.bib));
}

// CheckEntryClass：エントリーの問題点
function entryIssues() {
  const list = [];
  CLASSES.forEach((c, k) => {
    const rows = entryRows(k);
    const cnt = countBy(rows.map(r => norm(r.bib)));
    for (const r of rows) {
      const b = norm(r.bib);
      if (!b) list.push(['warn', `${c}：ビブ未入力（${str(r.name)}）`]);
      else if (classOf(b) !== k) list.push(['err', `${c}：ビブ ${b} はこのクラスの番号ではありません`]);
    }
    const dup = [...cnt].filter(([, n]) => n > 1).map(([b]) => b);
    if (dup.length) list.push(['err', `${c}：ビブが重複しています（${dup.join('、')}）`]);
  });
  return list;
}

// エントリーのフリガナ（ビブで引き、無ければ名前で引く）
function kanaLookup() {
  const byBib = new Map(), byName = new Map();
  for (const rows of state.entries) for (const r of rows) {
    const kana = str(r.kana);
    if (!kana) continue;
    if (norm(r.bib)) byBib.set(norm(r.bib), kana);
    if (str(r.name)) byName.set(nameKey(r.name), kana);
  }
  return (bib, name) => byBib.get(norm(bib)) || byName.get(nameKey(name)) || '';
}
const nameKey = s => String(s ?? '').replace(/[\s　]/g, '');

// リザルトのうち指定クラスの行（入力順）
const resultRows = (run, k) => state['res' + run].filter(r => classOf(r.bib) === k);

// 「～1本目」：タイム順。Expert は決勝出走順（予選タイムの遅い順）
function firstRunList(k) {
  return sortBy(resultRows(1, k), (a, b) => cmpTime(a.time, b.time, k === 0));
}

// BuildStartList：出走リスト（2本目の Expert だけ予選タイムの遅い順）
function buildStartList(second) {
  const rows = [], issues = [];
  for (const k of RUN_ORDER) {
    if (second && k === 0) {
      const ex = firstRunList(0);
      if (!ex.length) issues.push(['err', 'Expert の1本目リザルトがありません。2本目の Expert は1本目タイムの遅い順に並べるため、先に1本目リザルトを取り込んでください。']);
      for (const r of ex) rows.push({ bib: norm(r.bib), name: str(r.name), k });
    } else {
      for (const r of entryRows(k)) {
        if (!norm(r.bib)) issues.push(['warn', `${CLASSES[k]}：ビブ未入力（${str(r.name)}）。ビブ空欄のまま出走リストに入ります。`]);
        rows.push({ bib: norm(r.bib), name: str(r.name), k });
      }
    }
  }
  return { rows, issues };
}

// その run でまだリザルトに行が無い出走者を、出走順のまま返す。
//   k を省くと全クラス。2本目の Expert は buildStartList が予選通過者だけを返すので、
//   そのクラスだけ特別扱いしなくてよい。
//   判定は「タイムが空か」ではなく「そのビブの行があるか」。行さえあれば
//   表に直接打てるので、押すたびに同じ人が増えることもない。
function missingRiders(run, k) {
  const got = new Set(state['res' + run].map(r => norm(r.bib)));
  return buildStartList(run === 2).rows
    .filter(r => r.bib && !got.has(r.bib) && (k == null || r.k === k));
}

// BuildResult：1本目と2本目をビブで突き合わせ、順位を付ける。
// 重複したビブは下の行のタイムを採用する（Excel 版と同じ）
function finalResult(k) {
  const r1 = sortBy(resultRows(1, k), (a, b) => cmpBib(a.bib, b.bib));
  const r2 = sortBy(resultRows(2, k), (a, b) => cmpBib(a.bib, b.bib));
  const out = [], idx = new Map(), seen2 = new Set(), dup1 = new Set(), dup2 = new Set();

  for (const r of r1) {
    const key = norm(r.bib);
    let o = idx.get(key);
    if (!o) { o = { bib: key, name: '', t1: '', t2: '' }; idx.set(key, o); out.push(o); }
    else dup1.add(key);
    o.name = str(r.name);
    o.t1 = str(r.time);
  }
  for (const r of r2) {
    const key = norm(r.bib);
    let o = idx.get(key);
    if (!o) { o = { bib: key, name: str(r.name), t1: '', t2: '' }; idx.set(key, o); out.push(o); }
    else if (seen2.has(key)) dup2.add(key);
    seen2.add(key);
    o.t2 = str(r.time);
  }

  // Expert は決勝タイム、他は速い方（BEST TIME）で順位を決める
  for (const o of out) {
    o.best = k === 0 ? '' : bestOf(o.t1, o.t2);
    o.key = k === 0 ? o.t2 : o.best;
  }
  const rows = sortBy(out, (a, b) => cmpTime(a.key, b.key));

  // 同タイムは同順位。タイムが無い選手は順位なし
  let rank = 0;
  rows.forEach((o, i) => {
    if (!o.key) { o.rank = ''; return; }
    if (i === 0 || cmpTime(o.key, rows[i - 1].key) !== 0) rank = i + 1;
    o.rank = rank;
  });
  return { rows, dup1: [...dup1], dup2: [...dup2] };
}

function bestOf(a, b) {
  if (!a) return b || '';
  if (!b) return a;
  return cmpTime(a, b) <= 0 ? a : b;
}

// リザルトの問題点（行ごとの印と一覧）
function analyzeResults(run) {
  const rows = state['res' + run];
  const cnt = countBy(rows.map(r => norm(r.bib)));
  const entered = new Set(state.entries.flat().map(r => norm(r.bib)).filter(Boolean));
  const marks = rows.map(r => {
    const b = norm(r.bib);
    if (!b && !str(r.name) && !str(r.time)) return null;
    if (classOf(b) < 0) return { cls: 'err', title: 'ビブからクラスを判定できません（どのクラスにも入りません）' };
    if (cnt.get(b) > 1) return { cls: 'dup', title: '同じビブが複数行あります（下の行のタイムが採用されます）' };
    const t = str(r.time);
    if (t && !TIME_RE.test(norm(t))) return { cls: 'warn', title: 'タイムが mm:ss.fff 形式ではありません' };
    if (!entered.has(b)) return { cls: 'info', title: 'エントリーに無いビブです' };
    return null;
  });

  const issues = [];
  const unmatched = [], badTime = [], notEntered = [];
  rows.forEach((r, i) => {
    const m = marks[i];
    if (!m) return;
    const b = norm(r.bib);
    if (m.cls === 'err') unmatched.push(`${i + 1}行目（ビブ「${b}」）`);
    if (str(r.time) && !TIME_RE.test(norm(r.time))) badTime.push(`${b || '?'}「${str(r.time)}」`);
    if (classOf(b) >= 0 && !entered.has(b)) notEntered.push(b);
  });
  const dup = [...cnt].filter(([, n]) => n > 1).map(([b]) => b);
  if (unmatched.length) issues.push(['err', `ビブからクラスを判定できない行：${unmatched.join('、')}`]);
  if (dup.length) issues.push(['dup', `ビブが重複しています：${dup.join('、')}（下の行のタイムが採用されます。不要な行を消してください）`]);
  if (badTime.length) issues.push(['warn', `mm:ss.fff 形式でないタイム：${badTime.join('、')}`]);
  if (notEntered.length) issues.push(['info', `エントリーに無いビブ：${[...new Set(notEntered)].join('、')}`]);

  // 出走予定なのにリザルトに無い選手（2本目の Expert は1本目リザルトの選手が対象）
  const missing = missingRiders(run).map(r => `${r.bib} ${r.name}`);
  if (rows.length && missing.length) issues.push(['info', `リザルトに無い選手（DNS？）：${missing.join('、')}`]);
  return { marks, issues };
}

//=====================================================================
// 編集できる表
//   cols: [{ key, label, width, mono, fix(value, rowIndex) }]
//   analyze(): 行ごとの { cls, title } または null の配列
//=====================================================================
function makeGrid({ rows, cols, newRow, analyze, onEdit, reorder = false, numbered = true }) {
  const tbody = h('tbody');
  const table = h('table', { class: 'grid' },
    h('thead', {}, h('tr', {},
      numbered && h('th', {}, '#'),
      cols.map(c => h('th', { style: c.width ? `width:${c.width}` : null }, c.label)),
      h('th', {}))),
    tbody);
  const wrap = h('div', { class: 'gridwrap' }, table);

  const rowEl = (r, i) => h('tr', { 'data-i': i },
    numbered && h('td', { class: 'num' }, i + 1),
    cols.map(c => {
      const inp = h('input', { class: c.mono ? 'mono' : null, 'data-key': c.key, autocomplete: 'off', spellcheck: 'false' });
      inp.value = r[c.key] ?? '';
      return h('td', {}, inp);
    }),
    h('td', { class: 'ops' },
      reorder && h('button', { class: 'op', 'data-op': 'up', title: '上へ', tabindex: -1 }, '↑'),
      reorder && h('button', { class: 'op', 'data-op': 'down', title: '下へ', tabindex: -1 }, '↓'),
      h('button', { class: 'op del', 'data-op': 'del', title: 'この行を削除', tabindex: -1 }, '×')));

  function render(focus) {
    tbody.replaceChildren(...rows.map(rowEl));
    refresh();
    if (focus) {
      const inp = tbody.querySelector(`tr[data-i="${focus[0]}"] input[data-key="${focus[1]}"]`);
      if (inp) { inp.focus(); inp.select(); }
    }
  }

  function refresh() {
    const marks = analyze ? analyze() : [];
    tbody.querySelectorAll('tr').forEach((tr, i) => {
      const m = marks[i];
      tr.className = m ? m.cls : '';
      if (m) tr.title = m.title; else tr.removeAttribute('title');
    });
  }

  const pos = el => {
    const tr = el.closest('tr');
    return tr ? [Number(tr.dataset.i), el.dataset.key] : null;
  };
  const colOf = key => cols.find(c => c.key === key);
  const edited = () => { onEdit(); refresh(); };

  tbody.addEventListener('input', e => {
    const p = pos(e.target);
    if (!p) return;
    rows[p[0]][p[1]] = e.target.value;
    edited();
  });
  tbody.addEventListener('change', e => {
    const p = pos(e.target);
    if (!p) return;
    const c = colOf(p[1]);
    if (c.fix) {
      const v = c.fix(e.target.value, p[0]);
      if (v !== e.target.value) { e.target.value = v; rows[p[0]][p[1]] = v; edited(); }
    }
  });
  // Enter で下の行へ（最終行なら行を追加）
  tbody.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    const p = pos(e.target);
    if (!p) return;
    e.preventDefault();
    e.target.dispatchEvent(new Event('change', { bubbles: true }));
    const next = p[0] + (e.shiftKey ? -1 : 1);
    if (next < 0) return;
    if (next >= rows.length) { rows.push(newRow()); onEdit(); render([next, p[1]]); return; }
    const inp = tbody.querySelector(`tr[data-i="${next}"] input[data-key="${p[1]}"]`);
    if (inp) { inp.focus(); inp.select(); }
  });
  // Excel からの複数セル貼り付け：カーソル位置から右下へ埋める
  tbody.addEventListener('paste', e => {
    const p = pos(e.target);
    const text = e.clipboardData?.getData('text/plain') ?? '';
    if (!p || !/[\t\n]/.test(text)) return;
    e.preventDefault();
    const lines = text.replace(/\r\n?/g, '\n').replace(/\n$/, '').split('\n');
    const c0 = cols.findIndex(c => c.key === p[1]);
    lines.forEach((line, di) => {
      const i = p[0] + di;
      while (rows.length <= i) rows.push(newRow());
      line.split('\t').forEach((cell, dj) => {
        const c = cols[c0 + dj];
        if (c) rows[i][c.key] = c.fix ? c.fix(cell, i) : cell.trim();
      });
    });
    onEdit();
    render();
    toast(`${lines.length}行を貼り付けました。`);
  });
  tbody.addEventListener('click', e => {
    const btn = e.target.closest('button[data-op]');
    if (!btn) return;
    const i = Number(btn.closest('tr').dataset.i);
    const op = btn.dataset.op;
    if (op === 'del') rows.splice(i, 1);
    else if (op === 'up' && i > 0) [rows[i - 1], rows[i]] = [rows[i], rows[i - 1]];
    else if (op === 'down' && i < rows.length - 1) [rows[i + 1], rows[i]] = [rows[i], rows[i + 1]];
    else return;
    onEdit();
    render();
  });

  render();
  return {
    el: wrap,
    render,
    addRow() { rows.push(newRow()); onEdit(); render([rows.length - 1, cols[0].key]); },
  };
}

// ---------- 1 名簿取込 ----------
//   「○クラス名」で区切られた名簿テキストを、名前とフリガナに分けて取り込む。
//   1行は「氏名　フリガナ　金額（所属）」を想定し、金額と所属は落とす。
//   フリガナは行の右側から拾う。「井ノ口学　イノクチ　マナブ」のように名前に
//   カタカナが混じることがあり、左から探すと切る位置を誤るため。

const CLASS_JA = { エキスパート: 0, スポーツ: 1, ビギナー: 2, ガールズ: 3, ジュニア: 4, キッズ: 5, オールドタイマー: 6 };
CLASSES.forEach((c, k) => { CLASS_JA[c.toLowerCase()] = k; });

const KATA_ONLY = /^[゠-ヿ゛゜]+$/;
const HEAD_RE = /^[○●◯■□◆▼【\[]+[\s　]*/;

// 見出しの文字列からクラスの添字。分からなければ null
function rosterClassOf(head) {
  const key = head.replace(/[\s　]/g, '');
  if (key in CLASS_JA) return CLASS_JA[key];
  return key.toLowerCase() in CLASS_JA ? CLASS_JA[key.toLowerCase()] : null;
}

function parseRoster(text) {
  const groups = [];
  let cur = null;
  String(text || '').replace(/\r\n?/g, '\n').split('\n').forEach(raw => {
    const s = raw.replace(/^[\s　]+|[\s　]+$/g, '');
    if (!s) return;
    if (HEAD_RE.test(s)) {
      const head = s.replace(HEAD_RE, '').replace(/[】\]][\s　]*$/, '').trim();
      cur = { head, cls: rosterClassOf(head), rows: [] };
      groups.push(cur);
      return;
    }
    if (!cur) { cur = { head: '', cls: null, rows: [] }; groups.push(cur); }
    let t = s, affil = '';
    const m = t.match(/[（(]([^）)]*)[）)]/);
    if (m) { affil = m[1].trim(); t = t.slice(0, m.index) + t.slice(m.index + m[0].length); }
    t = t.replace(/[０-９0-9]+[\s　]*円/g, '');
    const toks = t.split(/[\s　]+/).filter(Boolean);
    let n = toks.length;
    while (n > 1 && KATA_ONLY.test(toks[n - 1])) n--;
    cur.rows.push({ name: toks.slice(0, n).join(''), kana: toks.slice(n).join(''), affil });
  });
  return groups.filter(g => g.head || g.rows.length);
}

function runParse() {
  ui.imp.groups = parseRoster(ui.imp.text);
  ui.imp.map = ui.imp.groups.map(g => g.cls);
  render();
}

function pickRosterFile() {
  const input = $('#file-txt');
  input.onchange = async () => {
    const file = input.files[0];
    input.value = '';
    if (!file) return;
    ui.imp.text = decodeText(await file.arrayBuffer());
    runParse();
  };
  input.click();
}

function rosterIssues() {
  const imp = ui.imp, issues = [];
  imp.groups.forEach((g, gi) => {
    if (imp.map[gi] == null && g.rows.length)
      issues.push(['warn', `「${g.head || '見出しなし'}」の${g.rows.length}人は取り込み先が未指定です（このままでは取り込まれません）。`]);
  });
  const noKana = [], byName = new Map();
  let noName = 0;
  imp.groups.forEach((g, gi) => {
    const k = imp.map[gi];
    if (k == null) return;
    g.rows.forEach(r => {
      if (!r.name) { noName++; return; }
      if (!r.kana) noKana.push(r.name);
      const key = nameKey(r.name);
      const hit = byName.get(key) || { name: r.name, cls: [] };
      hit.cls.push(CLASSES[k]);
      byName.set(key, hit);
    });
  });
  if (noName) issues.push(['err', `名前を取れなかった行が${noName}件あります。元のテキストを確認してください。`]);
  if (noKana.length) issues.push(['warn', `フリガナを取れませんでした：${noKana.join('、')}`]);
  [...byName.values()].filter(v => v.cls.length > 1).forEach(v =>
    issues.push(['dup', `${v.name} が複数のクラスに入っています（${v.cls.join(' / ')}）。同じ人に2つのビブを与えると集計が合わなくなります。`]));
  return issues;
}

function viewImport() {
  const imp = ui.imp;
  const ta = h('textarea', { class: 'roster', oninput: e => { imp.text = e.target.value; } });
  ta.value = imp.text;

  const pastePanel = h('div', { class: 'panel' }, h('h2', {}, '名簿テキストを取り込み'),
    h('p', { class: 'hint', style: 'margin-top:0' },
      '「○クラス名」で区切られた名簿をそのまま貼り付けてください。1行は「氏名　フリガナ　金額（所属）」の形を想定しています。金額と所属は取り込みません（エントリーに所属欄が無いため）。ビブは空欄で入ります。'),
    ta,
    h('div', { class: 'row', style: 'margin-top:8px' },
      h('button', { class: 'btn primary', onclick: runParse }, '解析する'),
      h('button', { class: 'btn', onclick: pickRosterFile }, 'テキストファイルを読み込む'),
      h('span', { style: 'flex:1' }),
      imp.text ? h('button', { class: 'btn danger', onclick: () => { imp.text = ''; imp.groups = null; render(); } }, 'クリア') : null));

  if (!imp.groups) return [pastePanel];
  if (!imp.groups.length)
    return [pastePanel, h('div', { class: 'panel' }, h('p', { class: 'empty' }, '取り込める行が見つかりませんでした。'))];

  const panels = imp.groups.map((g, gi) => {
    const sel = h('select');
    sel.append(h('option', { value: '-1' }, '取り込まない'));
    CLASSES.forEach((c, k) => sel.append(h('option', { value: String(k) }, c)));
    sel.value = String(imp.map[gi] ?? -1);
    sel.onchange = () => { imp.map[gi] = Number(sel.value) < 0 ? null : Number(sel.value); render(); };
    return h('div', { class: 'panel', style: imp.map[gi] == null ? 'opacity:.55' : null },
      h('div', { class: 'row' },
        h('h3', { style: 'margin:0' }, g.head || '(見出しなし)'),
        h('span', { class: 'chip' }, `${g.rows.length}人`),
        h('span', { style: 'flex:1' }),
        h('span', { class: 'hint', style: 'margin:0' }, '取り込み先'), sel),
      g.rows.length
        ? h('table', { class: 'list', style: 'margin-top:8px' },
            h('thead', {}, h('tr', {}, h('th', {}, '名前'), h('th', {}, 'フリガナ'), h('th', {}, '所属（取り込みません）'))),
            h('tbody', {}, g.rows.map(r => h('tr', { class: !r.name ? 'err' : (!r.kana ? 'warn' : null) },
              h('td', {}, r.name || '—'), h('td', {}, r.kana || '—'), h('td', { class: 'm' }, r.affil)))))
        : h('p', { class: 'empty' }, '行がありません'));
  });

  const total = imp.groups.reduce((n, g, gi) =>
    n + (imp.map[gi] == null ? 0 : g.rows.filter(r => r.name || r.kana).length), 0);
  const replace = h('input', { type: 'checkbox' });
  replace.checked = imp.replace;
  replace.onchange = () => { imp.replace = replace.checked; };

  const actionPanel = h('div', { class: 'panel' }, h('h2', {}, 'エントリーに取り込む'),
    issueList(rosterIssues(), '取り込める状態です。'),
    h('div', { class: 'row', style: 'margin-top:10px' },
      h('label', {}, replace, ' 取り込むクラスの今のエントリーを置き換える（外すと末尾に追加）'),
      h('span', { style: 'flex:1' }),
      h('button', { class: 'btn primary', disabled: !total, onclick: () => doRosterImport(total) },
        `${total}人を取り込む`)));

  return [pastePanel, ...panels, actionPanel];
}

function doRosterImport(total) {
  const imp = ui.imp;
  if (!total) return;
  const add = CLASSES.map(() => []);
  imp.groups.forEach((g, gi) => {
    const k = imp.map[gi];
    if (k == null) return;
    g.rows.forEach(r => { if (r.name || r.kana) add[k].push({ bib: '', name: r.name, kana: r.kana }); });
  });
  add.forEach((a, k) => { if (a.length) state.entries[k] = imp.replace ? a : entryRows(k).concat(a); });
  save();
  imp.groups = null;
  ui.step = 'entry';
  render();
  window.scrollTo(0, 0);
  toast(`${total}人を取り込みました。ビブは空欄です。`);
}

function splitTsv(text) {
  return text.replace(/\r\n?/g, '\n').split('\n').map(l => l.split('\t').map(s => s.trim()));
}

function pasteEntriesDialog(k) {
  const ta = h('textarea', { placeholder: 'Excel でコピーした範囲を貼り付けてください' });
  const one = h('input', { type: 'radio', name: 'pm', checked: true });
  const all = h('input', { type: 'radio', name: 'pm' });
  const replace = h('input', { type: 'checkbox', checked: true });
  openDialog('エントリーをまとめて貼り付け', [
    h('label', {}, one, `${CLASSES[k]} に貼り付け（Bib・Name・フリガナ の2～3列）`),
    h('label', {}, all, `全クラス一括（Bib・Name をクラスの順に横へ並べた ${CLASSES.length * 2} 列。Excel の Entry シートは A～L 列の6クラス分）`),
    ta,
    h('label', {}, replace, '今のエントリーを置き換える（外すと末尾に追加）'),
    h('p', { class: 'hint' }, '見出し行（Bib、Name など）は自動で読み飛ばします。'),
  ], '取り込む', () => {
    const lines = splitTsv(ta.value);
    const isHeader = (b, n) => /^bib$/i.test(b) || /^name$/i.test(n) || CLASSES.includes(b);
    const add = CLASSES.map(() => []);
    for (const cells of lines) {
      if (all.checked) {
        for (let j = 0; j < CLASSES.length; j++) {
          const b = cells[j * 2] ?? '', n = cells[j * 2 + 1] ?? '';
          if ((b || n) && !isHeader(b, n)) add[j].push({ bib: fixEntryBib(b, j), name: n, kana: '' });
        }
      } else {
        const [b = '', n = '', kana = ''] = cells;
        if ((b || n) && !isHeader(b, n)) add[k].push({ bib: fixEntryBib(b, k), name: n, kana });
      }
    }
    const total = add.reduce((n, a) => n + a.length, 0);
    if (!total) { toast('取り込める行がありませんでした。', true); return false; }
    add.forEach((a, j) => {
      if (!all.checked && j !== k) return;
      state.entries[j] = replace.checked ? a : entryRows(j).concat(a);
    });
    save(); render();
    toast(`${total}人を取り込みました。`);
  });
}

// エントリーリスト（名前・フリガナの2列）からフリガナを補う
function importKanaDialog() {
  const ta = h('textarea', { placeholder: '名前<TAB>フリガナ（Excel の「エントリーリスト」シートの A:B 列をコピー）' });
  const over = h('input', { type: 'checkbox' });
  openDialog('フリガナ表を取り込み', [
    h('p', { class: 'hint', style: 'margin-top:0' }, '名前が一致した選手のフリガナを埋めます（空白の有無は無視）。全クラスが対象です。'),
    ta,
    h('label', {}, over, '入力済みのフリガナも上書きする'),
  ], '取り込む', () => {
    const dict = new Map();
    for (const [n, kana] of splitTsv(ta.value)) if (n && kana) dict.set(nameKey(n), kana);
    if (!dict.size) { toast('名前とフリガナの2列が見つかりませんでした。', true); return false; }
    let filled = 0;
    const missing = [];
    for (const rows of state.entries) for (const r of rows) {
      if (!str(r.name)) continue;
      const kana = dict.get(nameKey(r.name));
      if (kana && (over.checked || !str(r.kana))) { r.kana = kana; filled++; }
      else if (!kana && !str(r.kana)) missing.push(str(r.name));
    }
    save(); render();
    toast(`${filled}人のフリガナを入れました。` + (missing.length ? `\n表に無い名前：${missing.slice(0, 10).join('、')}${missing.length > 10 ? ` ほか${missing.length - 10}人` : ''}` : ''));
  });
}

function viewResult(run) {
  const key = 'res' + run;
  const rows = state[key];
  const issuesBox = h('div');
  const chips = h('div', { class: 'chips' });
  const emptyMsg = h('p', { class: 'empty' }, 'まだ取り込まれていません。');
  const clearBtn = h('button', { class: 'btn danger', onclick: () => {
    if (confirm(`${run}本目リザルト${rows.length}行をすべて消します。よろしいですか？`)) { state[key] = []; save(); render(); }
  } }, 'すべて消す');
  const showStatus = () => {
    emptyMsg.style.display = rows.length ? 'none' : '';
    clearBtn.disabled = !rows.length;
    const { issues } = analyzeResults(run);
    issuesBox.replaceChildren(issueList(issues, rows.length ? '問題は見つかりませんでした。' : '') || '');
    const nUnknown = rows.filter(r => (norm(r.bib) || str(r.name) || str(r.time)) && classOf(r.bib) < 0).length;
    // replaceChildren は h() と違い、配列を展開せず null も読み飛ばさない。
    // そのまま渡すと "[object HTMLSpanElement]" や "null" が表示されるので広げて渡す。
    chips.replaceChildren(
      h('span', { class: 'chip' }, `${rows.length}行`),
      ...CLASSES.map((c, k) => h('span', { class: 'chip' }, `${c} ${resultRows(run, k).length}`)),
      ...(nUnknown ? [h('span', { class: 'chip err' }, `クラス不明 ${nUnknown}`)] : []));
  };

  const grid = makeGrid({
    rows,
    cols: [
      { key: 'bib', label: 'Bib', width: '90px', mono: true, fix: norm },
      { key: 'name', label: 'Name', fix: v => v.trim() },
      { key: 'time', label: 'Time', width: '160px', mono: true, fix: norm },
    ],
    newRow: () => ({ bib: '', name: '', time: '' }),
    analyze: () => analyzeResults(run).marks,
    onEdit: () => { save(); showStatus(); },
  });
  showStatus();

  const drop = h('div', { class: 'drop' }, 'リザルト CSV をここにドロップ、または ',
    h('button', { class: 'btn primary', onclick: () => pickCsv(run) }, 'ファイルを選ぶ'));
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => {
    e.preventDefault();
    drop.classList.remove('over');
    if (e.dataTransfer.files[0]) importResultCsv(e.dataTransfer.files[0], run);
  });

  const resort = cmp => { state[key] = sortBy(rows, cmp); save(); render(); };

  // 計測ソフトを通さないクラス（Kids の手集計など）のために、まだリザルトに
  // 行が無い出走者をビブ・名前入りで追加する。あとは Time に打つだけになる。
  const fillSel = h('select', { title: '行を追加するクラス' });
  fillSel.append(h('option', { value: '-1' }, '全クラス'));
  CLASSES.forEach((c, k) => fillSel.append(h('option', { value: String(k) }, c)));
  fillSel.value = String(ui.fillCls);
  fillSel.onchange = () => { ui.fillCls = Number(fillSel.value); };

  const fill = () => {
    const k = ui.fillCls < 0 ? null : ui.fillCls;
    const label = k == null ? '全クラス' : CLASSES[k];
    const add = missingRiders(run, k);
    if (!add.length) { toast(`${label}は出走者全員が表にあります。`); return; }
    const at = rows.length;
    add.forEach(r => rows.push({ bib: r.bib, name: r.name, time: '' }));
    save();
    showStatus();
    grid.render([at, 'time']);       // 追加した最初の行の Time にカーソルを置く
    toast(`${label}の${add.length}人を追加しました。タイムを入力してください。`
      + '\n入力して Enter を押すと下の行に移ります。');
  };

  return [
    h('div', { class: 'panel' }, h('h2', {}, `${run}本目リザルトの取り込み`),
      drop,
      h('p', { class: 'hint' }, '計測ソフトのリザルト CSV（9項目、見出しなし）の2番目（ビブ）、3番目（名前）、5番目（タイム）を取り込みます。読み込み後、同じビブの行（再計測など）を整理してください。クラス分けはビブで自動的に行われ、手順4・7にすぐ反映されます。'),
      h('p', { class: 'hint' }, '手集計のクラス（Kids など）や、CSV に入らなかった選手は、下の「エントリーから追加」でビブ・名前の入った行を出してからタイムを入力してください。')),
    h('div', { class: 'panel' },
      h('div', { class: 'row', style: 'margin-bottom:8px' }, chips),
      h('div', { class: 'row', style: 'margin-bottom:8px' },
        h('button', { class: 'btn', onclick: () => grid.addRow() }, '行を追加'),
        fillSel, h('button', { class: 'btn', onclick: fill }, 'エントリーから追加'),
        h('span', { style: 'width:12px' }),
        h('button', { class: 'btn', onclick: () => resort((a, b) => cmpBib(a.bib, b.bib)) }, 'ビブ順'),
        h('button', { class: 'btn', onclick: () => resort((a, b) => cmpTime(a.time, b.time)) }, 'タイム順'),
        h('span', { style: 'flex:1' }),
        clearBtn),
      grid.el,
      emptyMsg,
      h('div', { class: 'legend' },
        h('span', { class: 'err' }, 'クラス不明'), h('span', { class: 'dup' }, 'ビブ重複'),
        h('span', { class: 'warn' }, 'タイム形式'), h('span', { class: 'info' }, 'エントリーに無い'))),
    h('div', { class: 'panel' }, h('h2', {}, '確認事項'), issuesBox),
  ];
}

function pickCsv(run) {
  const input = $('#file-csv');
  input.value = '';
  input.onchange = () => { if (input.files[0]) importResultCsv(input.files[0], run); };
  input.click();
}

async function importResultCsv(file, run) {
  const text = decodeText(await file.arrayBuffer());
  const rows = [];
  let skipped = 0;
  for (const line of text.split(/\r\n|\r|\n/)) {
    if (!line.trim()) continue;
    const f = parseCsvLine(line);
    if (f.length >= 5) rows.push({ bib: norm(f[1]), name: f[2], time: norm(f[4]) });
    else skipped++;
  }
  if (!rows.length) { toast(`${file.name} から読み込める行がありませんでした（項目数が5未満）。`, true); return; }
  const key = 'res' + run;
  if (state[key].length && !confirm(`${run}本目リザルトの${state[key].length}行を、${file.name} の${rows.length}行で置き換えます。よろしいですか？`)) return;
  state[key] = rows;
  save();
  ui.step = key;
  render();
  toast(`${file.name} から${rows.length}件を読み込みました。` + (skipped ? `\n項目数が5未満の行が${skipped}行あったため、読み飛ばしました。` : ''), skipped > 0);
}

function viewFinal() {
  const k = ui.cls.final;
  const { rows, dup1, dup2 } = finalResult(k);
  const issues = [];
  if (dup1.length) issues.push(['dup', `1本目でビブが重複しています：${dup1.join('、')}（下の行のタイムを採用しました）`]);
  if (dup2.length) issues.push(['dup', `2本目でビブが重複しています：${dup2.join('、')}（下の行のタイムを採用しました）`]);
  const ex = k === 0;
  return h('div', { class: 'panel' },
    h('h2', {}, 'リザルト'),
    classTabs('final', i => finalResult(i).rows.length),
    h('div', { class: 'row', style: 'margin-bottom:10px' },
      h('strong', {}, `CLASS : ${CLASSES[k]}`),
      h('span', { class: 'hint', style: 'margin:0' }, ex ? '決勝（2本目）タイムで順位' : '2本のうち速い方（BEST TIME）で順位'),
      h('span', { style: 'flex:1' }),
      !VIEW && h('button', { class: 'btn', disabled: !rows.length, onclick: () => printFinal([k]) }, 'このクラスを印刷'),
      !VIEW && h('button', { class: 'btn', onclick: () => printFinal(CLASSES.map((_, i) => i).filter(i => finalResult(i).rows.length)) }, '全クラスを印刷')),
    issues.length ? h('div', { style: 'margin-bottom:10px' }, issueList(issues)) : null,
    rows.length
      ? h('table', { class: 'list' },
          h('thead', {}, h('tr', {}, h('th', { class: 'r', style: 'width:60px' }, 'RANK'), h('th', { style: 'width:80px' }, 'BIB'), h('th', {}, 'NAME'),
            h('th', {}, ex ? '1st. TIME（予選）' : '1st. TIME'), h('th', {}, ex ? 'Final Time' : '2nd. TIME'), !ex && h('th', {}, 'BEST TIME'))),
          h('tbody', {}, rows.map(o => h('tr', {},
            h('td', { class: 'r' }, o.rank), h('td', { class: 't' }, o.bib), h('td', {}, o.name),
            h('td', { class: 't' }, o.t1), h('td', { class: 't' + (ex ? ' best' : '') }, o.t2), !ex && h('td', { class: 't best' }, o.best)))))
      : h('p', { class: 'empty' }, 'このクラスのリザルトはまだありません。'),
    h('p', { class: 'hint' }, '同タイムは同順位、タイムの無い選手は順位なしで末尾に並びます。'));
}

// ---------- 9 Web用 ----------
function webLines() {
  const lines = [];
  CLASSES.forEach((c, k) => {
    if (lines.length) lines.push([]);
    lines.push([c]);
    for (const o of finalResult(k).rows) lines.push([o.rank, o.name, o.key]);
  });
  return lines;
}

function viewWeb() {
  const lines = webLines();
  const tsv = lines.map(l => l.join('\t')).join('\r\n');
  const hasData = state.res1.length || state.res2.length;
  return h('div', { class: 'panel' },
    h('h2', {}, 'Web 掲載用データ'),
    h('p', { class: 'hint', style: 'margin:0 0 10px' }, '全クラスの 順位・名前・タイム（Expert は決勝タイム、他は BEST TIME）。「コピー」で Excel などにそのまま貼り付けられます。'),
    h('div', { class: 'row', style: 'margin-bottom:10px' },
      h('button', { class: 'btn primary', disabled: !hasData, onclick: async () => toast(await copyText(tsv) ? 'クリップボードにコピーしました。' : 'コピーできませんでした。', false) }, 'コピー（タブ区切り）'),
      h('button', { class: 'btn', disabled: !hasData, onclick: () => {
        const name = `${state.event.name}Web用.csv`;
        if (downloadSjisCsv(name, lines)) toast(`${name} を保存しました。`);
      } }, 'CSV を保存')),
    hasData
      ? h('table', { class: 'list' }, h('tbody', {}, lines.map(l =>
          l.length === 1 ? h('tr', { class: 'sep' }, h('td', { colspan: 3 }, l[0]))
          : l.length ? h('tr', {}, h('td', { class: 'r', style: 'width:60px' }, l[0]), h('td', {}, l[1]), h('td', { class: 't' }, l[2]))
          : null)))
      : h('p', { class: 'empty' }, 'リザルトがまだありません。'));
}

//=====================================================================
// 印刷（A4 縦。見出しは各ページに繰り返す）
//=====================================================================
function printPages(pages) {
  $('#print-root').replaceChildren(...pages);
  window.print();
}

function pageHeader(left, sub, colspan) {
  return h('tr', { class: 'p-head' }, h('td', { colspan },
    h('div', { class: 'p-hd' },
      h('div', { class: 'l' }, left, sub ? h('small', {}, sub) : null),
      h('div', { class: 'r' }, formatDate(state.event.date), h('br'), 'by UEDA SYSTEM'))));
}

// 出走リストを、クラスの区切りを挟んだ印刷用の行の並びに直す。
//   区切りは1行ぶん使う。列の最後の行に来ると見出しだけが取り残されるので、
//   そのときは空行を1つ入れてクラスごと次の列の先頭から始める。
function startListCells(rows) {
  const cells = [];
  let lastK = -1;
  for (const r of rows) {
    if (r.k !== lastK) {
      if (cells.length % STARTLIST_ROWS === STARTLIST_ROWS - 1) cells.push(null);
      cells.push({ sep: CLASSES[r.k] });
      lastK = r.k;
    }
    cells.push(r);
  }
  return cells;
}

function printStartList(rows, second) {
  const kana = kanaLookup();
  const title = `${state.event.name} スタートリスト${second ? '2本目' : '1本目'}`;
  const all = startListCells(rows);
  const pages = [];
  for (let p = 0; p < all.length; p += STARTLIST_PER_PAGE) {
    const chunk = all.slice(p, p + STARTLIST_PER_PAGE);
    const trs = [];
    for (let i = 0; i < STARTLIST_ROWS; i++) {
      const cells = [];
      for (let col = 0; col < STARTLIST_COLS; col++) {
        const r = chunk[col * STARTLIST_ROWS + i];
        if (col) cells.push(h('td', { class: 'gap' }));
        if (r && r.sep) cells.push(h('td', { class: 'sep', colspan: 3 }, r.sep));
        else cells.push(h('td', { class: 'b' }, r?.bib ?? ''), h('td', {}, r?.name ?? ''), h('td', {}, r ? kana(r.bib, r.name) : ''));
      }
      trs.push(h('tr', {}, cells));
    }
    const colgroup = h('colgroup', {}, [0, 1, 2].map(col => [col ? h('col', { style: 'width:1.5mm' }) : null,
      h('col', { style: 'width:9mm' }), h('col', { style: 'width:25mm' }), h('col', { style: 'width:30mm' })]));
    pages.push(h('div', { class: 'page' }, h('div', { class: 'p-sl-title' }, title), h('table', { class: 'p-sl' }, colgroup, h('tbody', {}, trs))));
  }
  printPages(pages);
}

function printFirst(classIdx) {
  printPages(classIdx.map(k => {
    const list = firstRunList(k);
    return h('div', { class: 'page' }, h('table', { class: 'p-table' },
      h('thead', {}, pageHeader(firstTitle(k), state.event.name, 4),
        h('tr', {}, h('th', { style: 'width:20mm' }, 'NUMBER'), h('th', { style: 'width:20mm' }, 'BIB'), h('th', {}, 'NAME'), h('th', { style: 'width:36mm' }, 'Time'))),
      h('tbody', {}, list.map((r, i) => h('tr', {}, h('td', { class: 'c' }, i + 1), h('td', { class: 'c' }, norm(r.bib)), h('td', {}, str(r.name)), h('td', { class: 'c t' }, str(r.time)))))));
  }));
}

function printFinal(classIdx) {
  printPages(classIdx.map(k => {
    const ex = k === 0;
    const { rows } = finalResult(k);
    const ncol = ex ? 5 : 6;
    return h('div', { class: 'page' }, h('table', { class: 'p-table' },
      h('thead', {}, pageHeader(`CLASS : ${CLASSES[k]}`, state.event.name, ncol),
        h('tr', {}, h('th', { style: 'width:15mm' }, 'RANK'), h('th', { style: 'width:15mm' }, 'BIB'), h('th', {}, 'NAME'),
          h('th', { style: 'width:30mm' }, '1st. TIME'), h('th', { style: 'width:30mm' }, ex ? 'Final Time' : '2nd. TIME'),
          !ex && h('th', { style: 'width:30mm' }, 'BEST TIME'))),
      h('tbody', {}, rows.map(o => h('tr', {},
        h('td', { class: 'c' }, o.rank), h('td', { class: 'c' }, o.bib), h('td', {}, o.name),
        h('td', { class: 'c t' }, o.t1), h('td', { class: 'c t' }, o.t2), !ex && h('td', { class: 'c t' }, o.best))))));
  }));
}

//=====================================================================
// 公開（Firestore）
//   編集するのは1人だけ、他のメンバーはスタートリストとリザルトを見るだけ、
//   という使い方のための仕組み。「公開」を押したときだけ、そのときの内容を
//   ドキュメント1件に上書きし、#view/<大会ID> で開いた画面がそれを購読する。
//   ・自動保存ではなく押したときだけにしてある。リザルト取込は重複ビブを手で
//     直す前提なので、常時同期だと直しかけの順位が見えてしまう。
//   ・state をそのままの形では置けない。Firestore は配列の入れ子を持てず、
//     entries がクラス別の配列の配列になっているため、JSON 文字列1個で持つ。
//   ・公開するのは掲示・Web 掲載するものだけ。フリガナは送らない。
//   ・設定していない（FIREBASE.config が null）間は、公開まわりは動かないだけで
//     今までどおり使える。
//
//   Firebase 側の設定：
//     Firestore のルールは events/<大会ID> を「読みは全員、書きは自分だけ」に。
//       match /databases/{db}/documents/events/{id} {
//         allow read: if true;
//         allow write: if request.auth != null && request.auth.token.email == '<自分のアドレス>';
//       }
//     Authentication で Google ログインを有効にし、承認済みドメインに
//     projectsubmarine.github.io を入れておく。
//=====================================================================
let pubText = '';
let fb = null;

function setPub(text) {
  pubText = text;
  $('#pub-label').textContent = text;
}

const viewUrl = () => location.href.replace(/#.*$/, '') + '#view/' + FIREBASE.eventId;

const hhmm = d => d ? `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` : '';

// Firebase の読み込みは使うときまで遅らせる（設定していなければ一度も読み込まない）
async function firebase() {
  if (fb) return fb;
  if (!FIREBASE.config) throw new Error('未設定');
  const [app, fs] = await Promise.all([
    import(FIREBASE_SDK + 'firebase-app.js'),
    import(FIREBASE_SDK + 'firebase-firestore.js'),
  ]);
  const a = app.initializeApp(FIREBASE.config);
  // 閲覧側だけ端末に残す。電波が切れても、最後に受け取った内容を表示できる。
  // 編集側は残さない（送信が保留のまま「公開しました」と出ると困るため）。
  const db = VIEW
    ? fs.initializeFirestore(a, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) })
    : fs.getFirestore(a);
  fb = { app: a, fs, db, ref: fs.doc(db, 'events', EVENT_ID) };
  return fb;
}

// 公開する内容はリザルトだけ。エントリー（＝スタートリストの元）とフリガナは
// 送らない。名前もビブもタイムも空の行は落とす。
function publicState() {
  const pick = rows => rows
    .filter(r => str(r.bib) || str(r.name) || str(r.time))
    .map(r => ({ bib: String(r.bib ?? ''), name: String(r.name ?? ''), time: String(r.time ?? '') }));
  return {
    version: 1,
    event: { name: str(state.event.name), date: str(state.event.date) },
    res1: pick(state.res1),
    res2: pick(state.res2),
  };
}

async function publish() {
  if (!FIREBASE.config) {
    toast('公開の設定がまだです。index.html の FIREBASE に Firebase の設定値を入れてください。', true);
    return;
  }
  const btn = $('#btn-publish');
  btn.disabled = true;
  setPub('公開中…');
  try {
    const { fs, app, ref } = await firebase();
    const auth = await import(FIREBASE_SDK + 'firebase-auth.js');
    const a = auth.getAuth(app);
    // 書き込めるのは自分だけ。ログインは初回だけで、以後はこのブラウザに残る。
    if (!a.currentUser) await auth.signInWithPopup(a, new auth.GoogleAuthProvider());
    const data = publicState();
    await fs.setDoc(ref, {
      json: JSON.stringify(data),
      at: fs.serverTimestamp(),
      event: data.event.name,
      res1: data.res1.length,
      res2: data.res2.length,
    });
    setPub('公開 ' + hhmm(new Date()));
    toast('公開しました。閲覧用 URL：' + viewUrl());
  } catch (e) {
    setPub('公開できていません');
    const why = e && e.code === 'permission-denied' ? 'このアカウントには書き込みが許可されていません。'
      : e && e.code === 'auth/popup-closed-by-user' ? 'ログインが中断されました。'
      : (e && (e.message || e.code)) || '原因不明';
    toast('公開できませんでした。\n' + why, true);
  } finally {
    btn.disabled = false;
  }
}

// 閲覧モード：公開された内容を購読して表示するだけ
function subscribe() {
  if (!FIREBASE.config) { setPub('公開の設定がまだです'); return; }
  setPub('読み込み中…');
  let first = true;
  firebase().then(({ fs, ref }) => {
    fs.onSnapshot(ref, snap => {
      if (!snap.exists()) { setPub('まだ公開されていません'); return; }
      const d = snap.data();
      let s = null;
      try { s = sanitizeState(JSON.parse(d.json)); } catch (e) { s = null; }
      if (!s) { setPub('データを読めませんでした'); return; }
      state = s;
      // 最初に受け取ったとき、リザルトが出ていればリザルト画面を開く
      if (first && (state.res1.length || state.res2.length)) ui.step = 'final';
      first = false;
      const at = d.at && d.at.toDate ? d.at.toDate() : null;
      setPub((snap.metadata.fromCache ? '通信なし（最後に受信した分）　' : '') + (at ? '更新 ' + hhmm(at) : '更新 ―'));
      render();
    }, err => {
      setPub('つながりません');
      toast('公開データを読み込めませんでした。\n' + (err.message || err.code), true);
    });
  }).catch(e => {
    setPub('つながりません');
    toast('公開データを読み込めませんでした。\n' + (e.message || e), true);
  });
}

//=====================================================================
// 上部のボタン
//=====================================================================
$('#btn-publish').onclick = publish;

$('#btn-viewurl').onclick = async () => {
  const url = viewUrl();
  toast(await copyText(url) ? '閲覧用 URL をコピーしました。\n' + url : url);
};

$('#btn-save').onclick = () => {
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-` +
                `${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;
  download(`${state.event.name || 'MMC'}_data_${stamp}.json`, JSON.stringify(state, null, 1), 'application/json');
};

$('#btn-load').onclick = () => {
  const input = $('#file-json');
  input.value = '';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    let s = null;
    try { s = sanitizeState(JSON.parse(decodeText(await file.arrayBuffer()))); } catch (e) { s = null; }
    if (!s) { toast(`${file.name} は大会データのファイルではありません。`, true); return; }
    if (!confirm(`${file.name} を読み込みます。今のデータは置き換わります。よろしいですか？`)) return;
    state = s;
    save();
    render();
    toast('読み込みました。');
  };
  input.click();
};

// clearAllData：エントリー以外を消す
$('#btn-clear').onclick = () => {
  if (!confirm('1本目・2本目のリザルトをすべて消します（エントリーと大会情報は残ります）。よろしいですか？')) return;
  state.res1 = [];
  state.res2 = [];
  save();
  render();
  toast('クリアしました。（エントリーはそのままです）');
};

$('#btn-reset').onclick = () => {
  if (!confirm('エントリーも含めて、すべてのデータを消します。必要なら先に「データを保存」してください。\nよろしいですか？')) return;
  state = emptyState();
  save();
  ui.step = 'entry';
  render();
};

// 別のタブで変更されたら読み直す（閲覧モードは公開された分だけを見る）
if (!VIEW) window.addEventListener('storage', e => {
  if (e.key !== STORE_KEY) return;
  const s = loadState();
  if (s) { state = s; render(); toast('別のタブでの変更を読み込みました。'); }
});

if (VIEW) {
  document.title = 'MMC リザルト';
  $('.app').classList.add('view');
  subscribe();
}

render();
</script>

</html>
